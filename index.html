<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-Shirt Shop</title>

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <script type="text/javascript">
    // Initialize EmailJS with your public key
    (function() {
      emailjs.init("LqpKE0-D1wVMGZaMs"); // Replace with your public key
    })();

    // Function to handle the purchase and send emails
    window.purchaseShirt = function(shirtName) {
      // Get the email and shipping address entered by the user
      var userEmail = document.getElementById("email").value;
      var shippingAddress = document.getElementById("address").value;

      // Check if email and address are provided
      if (!userEmail || !shippingAddress) {
        alert("Please enter your email and shipping address.");
        return;
      }

      // Template parameters for buyer's order confirmation email
      const buyerTemplateParams = {
        order_id: "123456", // Example Order ID
        orders: [
          {
            name: shirtName,   // Product name, dynamic based on button clicked
            units: 1,          // Quantity of product, static here, can be dynamic
            price: 19.99       // Product price, static here, can be dynamic
          }
        ],
        cost: {
          shipping: 5.00,    // Shipping cost
          total: 24.99       // Total cost (product price + shipping)
        },
        email: userEmail,     // Use the email entered by the user
        address: shippingAddress, // Add shipping address to template
      };

      // Template parameters for vendor's notification email
      const vendorTemplateParams = {
        order_id: "123456", // Example Order ID
        orders: [
          {
            name: shirtName,
            units: 1,
            price: 19.99
          }
        ],
        cost: {
          shipping: 5.00,
          total: 24.99
        },
        buyer_email: userEmail,  // Send the buyer's email to the vendor
        shipping_address: shippingAddress, // Send the shipping address to the vendor
        shirt_name: shirtName   // Product name for vendor notification
      };

      // Send email to the buyer (order confirmation)
      emailjs.send("service_kqk8ndx", "template_3xod27w", buyerTemplateParams)
        .then(function(response) {
          alert("Confirmation email sent to you!");
        }, function(error) {
          alert("Failed to send confirmation email: " + JSON.stringify(error));
        });

      // Send email to the vendor (order notification)
      emailjs.send("service_kqk8ndx", "template_xyutwh5", vendorTemplateParams)
        .then(function(response) {
          console.log("Notification email sent to vendor.");
        }, function(error) {
          console.log("Failed to send vendor notification: " + JSON.stringify(error));
        });
    };
  </script>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 40px; }
    .shirt { display: inline-block; margin: 20px; border: 1px solid #ccc; padding: 20px; border-radius: 10px; }
    .shirt img { width: 150px; }
    button { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background-color: #218838; }
    input[type="email"], input[type="text"] { padding: 10px; width: 80%; margin-bottom: 20px; }
  </style>
</head>

<body>

  <h1>Buy a T-Shirt</h1>

  <!-- Email and Address Input -->
  <label for="email">Enter your email address:</label><br>
  <input type="email" id="email" placeholder="youremail@example.com"><br><br>

  <label for="address">Enter your shipping address:</label><br>
  <input type="text" id="address" placeholder="Your shipping address"><br><br>

  <!-- Shirt 1: Classic White Tee -->
  <div class="shirt">
    <h3>Classic White Tee</h3>
    <img src="https://placehold.co/150x150?text=T-Shirt" alt="White T-Shirt">
    <p>$19.99</p>
    <button onclick="purchaseShirt('Classic White Tee')">Buy</button>
  </div>

  <!-- Shirt 2: Black Graphic Tee -->
  <div class="shirt">
    <h3>Black Graphic Tee</h3>
    <img src="https://placehold.co/150x150?text=T-Shirt" alt="Black T-Shirt">
    <p>$24.99</p>
    <button onclick="purchaseShirt('Black Graphic Tee')">Buy</button>
  </div>

</body>
</html>
